<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Chauffeur Zim - Book a Ride</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #f4f4f4; color: #222; }
  .top { background: #111; color: #fff; padding: 18px; text-align: center; }
  .top h1 { font-size: 24px; }
  .top p { color: #25D366; margin-top: 4px; font-weight: bold; }
  .box { background: #fff; margin: 12px; padding: 16px; border-radius: 12px; }
  h2 { font-size: 18px; margin-bottom: 10px; }
  label { display: block; font-size: 13px; font-weight: bold; margin: 10px 0 4px; }
  input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
  button { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #25D366; color: #fff; font-size: 17px; font-weight: bold; margin-top: 14px; cursor: pointer; }
  button:disabled { background: #999; }
  .price-box { background: #eafff1; border: 1px solid #25D366; padding: 12px; border-radius: 10px; margin-top: 12px; font-size: 15px; line-height: 1.6; display: none; }
  .msg { margin-top: 12px; padding: 12px; border-radius: 8px; display: none; font-size: 14px; line-height: 1.5; }
  .ok { background: #eafff1; display: block; }
  .err { background: #ffe5e5; display: block; }
  .prices { font-size: 14px; line-height: 1.8; }
  .prices b { color: #111; }
  .links { text-align: center; margin: 10px; }
  .links a { color: #111; font-weight: bold; }
</style>
</head>
<body>

<div class="top">
  <h1>🚕 My Chauffeur Zim</h1>
  <p>WhatsApp: 0783 264 675</p>
</div>

<div class="box">
  <h2>💰 Price List</h2>
  <div class="prices">
    <b>$1.00 per kilometer + $0.50 driver fee = $1.50 per km</b><br>
    5km = $7.50<br>
    10km = $15.00<br>
    15km = $22.50<br>
    20km = $30.00<br>
    No hidden fees. Same price day and night.
  </div>
</div>

<div class="box">
  <h2>Book a Ride 🚕</h2>
  <form id="bookForm">
    <label>Your Name</label>
    <input id="name" required placeholder="e.g. Tino">

    <label>Your Phone (WhatsApp)</label>
    <input id="phone" required placeholder="0783264675">

    <label>Pickup Location</label>
    <input id="pickup" required placeholder="e.g. Bulawayo CBD">

    <label>Destination</label>
    <input id="destination" required placeholder="e.g. Hillside">

    <label>City</label>
    <select id="city">
      <option>Harare</option>
      <option selected>Bulawayo</option>
      <option>Mutare</option>
      <option>Gweru</option>
      <option>Masvingo</option>
      <option>Kwekwe</option>
      <option>Victoria Falls</option>
    </select>

    <label>Distance (km) - we auto-calculate, or type it</label>
    <input id="km" type="number" step="0.1" required placeholder="e.g. 10">

    <div class="price-box" id="priceBox"></div>

    <button type="submit" id="btn">Confirm Booking - Send to WhatsApp</button>
  </form>
  <div class="msg" id="msg"></div>
</div>

<div class="links">
  <a href="driver.html">Are you a driver? Register here →</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // --- PUT YOUR KEYS HERE ---
  const SUPABASE_URL = 'YOUR_SUPABASE_URL';
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const PER_KM = 1.50;
  const kmInput = document.getElementById('km');
  const priceBox = document.getElementById('priceBox');
  const msg = document.getElementById('msg');

  function showPrice() {
    const km = parseFloat(kmInput.value);
    if (!km || km <= 0) { priceBox.style.display = 'none'; return; }
    const total = (km * PER_KM).toFixed(2);
    priceBox.style.display = 'block';
    priceBox.innerHTML = `Distance: <b>${km}km</b><br>Pricing: $1.00/km + $0.50 fee = $1.50/km<br><b>Total: $${total}</b>`;
  }
  kmInput.addEventListener('input', showPrice);

  // Auto-calculate distance when pickup/destination change
  async function autoKm() {
    const pickup = document.getElementById('pickup').value.trim();
    const dest = document.getElementById('destination').value.trim();
    const city = document.getElementById('city').value;
    if (!pickup || !dest) return;
    try {
      async function geo(place) {
        const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(place + ', ' + city + ', Zimbabwe')}&limit=1`);
        const d = await r.json();
        return d[0] ? { lat: d[0].lat, lon: d[0].lon } : null;
      }
      const a = await geo(pickup);
      const b = await geo(dest);
      if (!a || !b) return;
      const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`);
      const d = await r.json();
      if (d.routes && d.routes[0]) {
        kmInput.value = (d.routes[0].distance / 1000).toFixed(1);
        showPrice();
      }
    } catch (e) {}
  }
  document.getElementById('destination').addEventListener('change', autoKm);

  document.getElementById('bookForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn');
    btn.disabled = true; btn.textContent = 'Sending...';
    msg.className = 'msg'; msg.style.display = 'none';

    const name = document.getElementById('name').value.trim();
    const phoneRaw = document.getElementById('phone').value.trim();
    const phone = phoneRaw.replace(/[^0-9]/g, '');
    // Normalize to 263...
    let fullPhone = phone;
    if (phone.startsWith('0')) fullPhone = '263' + phone.slice(1);
    if (phone.length === 9) fullPhone = '263' + phone;

    const pickup = document.getElementById('pickup').value.trim();
    const destination = document.getElementById('destination').value.trim();
    const city = document.getElementById('city').value;
    const km = parseFloat(kmInput.value);
    const total = (km * PER_KM).toFixed(2);

    // --- THIS IS WHAT THE BOT LOOKS FOR ---
    const { data, error } = await supabase.from('bookings').insert([{
      customer_name: name,
      phone: fullPhone,
      pickup: pickup,
      destination: destination,
      city: city,
      distance_km: km,
      price: total,
      status: 'pending',
      source: 'website',
      whatsapp_sent: false
    }]).select().single();

    if (error) {
      msg.className = 'msg err'; msg.style.display = 'block';
      msg.textContent = 'Error: ' + error.message + ' - Check Supabase keys / bookings table.';
      btn.disabled = false; btn.textContent = 'Confirm Booking - Send to WhatsApp';
      return;
    }

    msg.className = 'msg ok'; msg.style.display = 'block';
    msg.innerHTML = `✅ Booking saved! Booking ID: ${data.id}<br>From: ${pickup} → ${destination}<br>${km}km = $${total}<br><br>We are sending this to WhatsApp now. Our team / bot will WhatsApp you on ${fullPhone} shortly. You can also WhatsApp us on 0783 264 675.`;
    btn.disabled = false; btn.textContent = 'Confirm Booking - Send to WhatsApp';
    document.getElementById('bookForm').reset();
    priceBox.style.display = 'none';
  });
</script>
</body>
</html>
