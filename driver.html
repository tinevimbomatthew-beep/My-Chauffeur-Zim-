<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Chauffeur Zim - Driver</title>
<style>body{font-family:Arial;padding:16px;background:#f5f5f5}.card{background:#fff;padding:16px;border-radius:12px;margin-bottom:12px}input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ddd}button{background:#000;color:#fff;font-weight:bold}button:disabled{background:#999}.green{color:green;font-weight:bold}.red{color:red;font-weight:bold}#timer{font-size:22px;font-weight:bold;color:#d00}</style>
</head><body>
<h2>🚖 My Chauffeur Zim - Driver</h2>
<div class="card"><b>Driver Name</b><input id="dname" placeholder="Tawanda"><b>Car Plate</b><input id="plate" placeholder="ABC 1234"><b>WhatsApp</b><input id="dphone" placeholder="263..."><button onclick="alert('Saved')">Save Details</button></div>
<div class="card"><h3>📍 NEW RIDE</h3><div id="ride">Waiting...</div><div>Time left: <span id="timer">3:00</span></div><button onclick="loadDemo()">Load Demo Ride - Paddonhurst → City Hall</button></div>
<div class="card"><h3>📏 Calculate & Bid - MIN + MAX ENFORCED</h3>
<b>Distance km (check Google Maps)</b><input id="km" type="number" placeholder="e.g. 10" oninput="calc()">
<b>Your Price Choice</b><select id="choice" onchange="calc()">
<option value="min">MIN - Cheapest - No fee</option>
<option value="max" selected>MAX - With fee</option>
</select>
<div id="priceBox">Enter km to see price</div>
<button id="bidBtn" onclick="placeBid()" disabled>POST BID</button></div>
<div class="card"><h3>🏆 Bids - First 5 in 3 mins, cheapest first</h3><div id="bids">No bids yet</div></div>
<script>
function isNight(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Africa/Harare'})).getHours()>=20;}
// MIN + MAX RULE - SAME IN BOT
function calcPrice(km, wantMax){
  const night=isNight();
  const MIN = night ? 1.50 : 1.00;
  const MAX = night ? 2.00 : 1.50;
  const perKm = wantMax ? MAX : MIN;
  return {night, MIN, MAX, perKm, total: perKm*km, minimum: MIN*km, maximum: MAX*km};
}
let currentRide=null; let bids=[];
function loadDemo(){currentRide={pickup:'1 Unwind Road, Paddonhurst',dropoff:'City Hall, Bulawayo',when:'Today 12pm',customer:'Tinevimbo'};document.getElementById('ride').innerHTML=`<b>${currentRide.pickup} → ${currentRide.dropoff}</b><br>When: ${currentRide.when}<br>Customer: ${currentRide.customer}<br>${isNight()?'🌙 NIGHT: MIN $1.50/km, MAX $2.00/km':'☀️ DAY: MIN $1.00/km, MAX $1.50/km'}`;let s=180;const el=document.getElementById('timer');const iv=setInterval(()=>{s--;el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s<=0){clearInterval(iv);el.textContent='CLOSED';document.getElementById('bidBtn').disabled=true;}},1000);}
function calc(){
  const km=parseFloat(document.getElementById('km').value); if(!km||km<=0){document.getElementById('priceBox').innerHTML='Enter km';return;}
  const wantMax=document.getElementById('choice').value==='max'; const p=calcPrice(km,wantMax);
  document.getElementById('priceBox').innerHTML=`<b>${km}km = $${p.total.toFixed(2)}</b><br>MIN allowed: $${p.minimum.toFixed(2)} ($${p.MIN.toFixed(2)}/km)<br>MAX allowed: $${p.maximum.toFixed(2)} ($${p.MAX.toFixed(2)}/km)<br><span class="green">✅ VALID - Inside MIN/MAX</span>`;
  document.getElementById('bidBtn').disabled=false; document.getElementById('bidBtn').textContent=`POST BID - $${p.total.toFixed(2)}`;
}
function placeBid(){
  const km=parseFloat(document.getElementById('km').value); const wantMax=document.getElementById('choice').value==='max'; const p=calcPrice(km,wantMax);
  if(p.total < p.minimum-0.01){alert('BLOCKED: Below MIN $'+p.minimum.toFixed(2));return;}
  if(p.total > p.maximum+0.01){alert('BLOCKED: Above MAX $'+p.maximum.toFixed(2));return;}
  if(bids.length>=5){alert('First 5 already filled');return;}
  const name=document.getElementById('dname').value||'Driver'; const plate=document.getElementById('plate').value||'---';
  bids.push({name,plate,km,total:p.total,label:wantMax?'With fee (MAX)':'No fee (MIN)'}); bids.sort((a,b)=>a.total-b.total);
  let h=''; bids.forEach((b,i)=>{h+=`${i+1}. ${b.name} - ${b.plate} - ${b.km}km = $${b.total.toFixed(2)} (${b.label})<br>`;}); document.getElementById('bids').innerHTML=h;
  alert('Bid posted! Locked: $'+p.total.toFixed(2)+' - MIN/MAX OK');
}
</script></body></html>
